# Development environment for solphin.
#
#   conda env create -f environment.yml
#   conda activate solphin
name: solphin

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - numpy>=2.0
  - scipy
  - matplotlib-base>=3.9.4
  - pymatgen>=2024.8.9
  - ipywidgets
  # sumo's own dependencies (solphin imports none of them directly), kept on
  # conda-forge so the pip block adds nothing but sumo, castepxbin and solphin.
  - colormath
  - h5py
  - phonopy
  - seekpath
  - spglib

  # --- notebooks / tutorial (pyproject.toml [tutorial] extra) ---
  - jupyterlab
  - ipykernel
  - nbformat
  - ipympl

  # --- docs (pyproject.toml [docs] extra; see docs/source/conf.py) ---
  - sphinx
  - sphinx-wagtail-theme
  - myst-nb

  # --- dev tooling (pyproject.toml [dev] extra) ---
  - pytest
  - pytest-cov
  - ruff
  - mypy
  - pre-commit
  - twine
  - pip

  # --- PyPI only; see the header. `pip` above is what runs this block. ---
  - pip:
      - sumo>=3.0
      - castepxbin>=0.3.1
      - -e .
