[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solphin"
version = "1.0.0"
description = "Figure of Merit for Photovoltaics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Philippa U Cox", email = "puc369@student.bham.ac.uk" },
    { name = "Peter P Russell", email = "ppr466@student.bham.ac.uk" }
]
keywords = [
    "photovoltaics",
    "solar",
    "VASP",
    "CASTEP",
    "OptaDOS",
    "DFT",
    "detailed-balance",
    "SLME"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

dependencies = [
    "numpy>=2.0",
    "scipy",
    "matplotlib>=3.9.4",
    "pymatgen>=2024.8.9",
    "sumo",
    "castepxbin",
    "ipywidgets"
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx-wagtail-theme", "myst-nb"]
tutorial = ["jupyterlab", "ipykernel", "nbformat", "ipympl"]
interactive = ["ipympl"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit", "build", "twine"]

[project.urls]
Homepage = "https://github.com/SMTG-Bham/solphin"
Documentation = "https://solphin.readthedocs.io"
Repository = "https://github.com/SMTG-Bham/solphin"
Issues = "https://github.com/SMTG-Bham/solphin/issues"

[tool.setuptools.packages.find]
include = ["solphin*"]
[tool.setuptools.package-data]
"solphin" = ["py.typed"]
"solphin.resources" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rx"
xfail_strict = true
# Both entries are deprecations inside sumo itself, on code paths solphin only
# reaches through sumo's public API, so there is nothing in solphin/ to change.
# 2.4.0.post1 is the newest release and master still carries every site, so
# there is no version to upgrade to either.
#
# Matched on message rather than module: pytest hands each entry to
# warnings._setoption, which re.escape()s the module field and anchors it with
# \Z, so a module pattern can only ever equal one machine's absolute
# site-packages path. `sumo.symmetry.*` looks right and matches nothing.
filterwarnings = [
    # spglib 2.5 deprecated the mapping interface on its dataset; sumo still
    # reads it that way at symmetry/kpath.py:227, kpath.py:232 and
    # kpoints.py:146. solphin never imports spglib -- every one of those reads
    # sits behind get_path_data.
    "ignore:dict interface is deprecated:DeprecationWarning",
    # sumo/electronic_structure/optics.py:14 imports gaussian_filter1d from
    # the scipy.ndimage.filters shim, deprecated and due for removal in SciPy
    # 2.0. It fires at import, so it lands once during collection whichever
    # tests run. Ignoring it gives up no early warning: when the namespace
    # goes this becomes an ImportError, which no filter can hide.
    "ignore:Please import `gaussian_filter1d` from the `scipy.ndimage` namespace:DeprecationWarning",
]

[tool.coverage.run]
source = ["solphin"]
relative_files = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/source/full_workflow_tutorial.ipynb"]

[tool.ruff.lint]
select = ["E402", "F401", "F811", "I", "D", "D212", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test docstrings are declarative statements of the property under test.
"tests/*" = ["D401"]

[tool.ruff.lint.isort]
known-first-party = ["solphin"]
[tool.mypy]
python_version = "3.11"
files = ["solphin", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sumo.*", "ipywidgets.*", "ipympl.*", "scipy.*"]
ignore_missing_imports = true
