[build-system]
# 77 is the floor for PEP 639: the SPDX `license` string and `license-files`
# below are both errors on older setuptools.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solphin"
version = "1.0.0"
description = "Figure of Merit for Photovoltaics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# 3.11 is set by the dependencies, not by our own syntax: the current releases
# of pymatgen, numpy, scipy and matplotlib all declare Requires-Python >=3.11,
# so a 3.10 resolve silently lands on years-old versions of all four. (Our own
# floor would be 3.10 -- band_structure.py and the dos.py dataclasses use PEP
# 604 unions in annotations that are evaluated at runtime.)
requires-python = ">=3.11"
authors = [
    { name = "Philippa U Cox", email = "puc369@student.bham.ac.uk" },
    { name = "Peter P Russell", email = "ppr466@student.bham.ac.uk" }
]
keywords = [
    "photovoltaics",
    "solar",
    "VASP",
    "DFT",
    "detailed-balance",
    "SLME"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

# Every entry below is imported at package-import time by solphin/__init__.py or
# one of the modules it pulls in. Add new runtime deps to *both* this list and
# environment.yml.
dependencies = [
    # db_fom.py integrates with np.trapezoid, which replaced the np.trapz alias
    # (deprecated in NumPy 2.0, removed in 2.4) and only exists from 2.0 on.
    "numpy>=2.0",
    "scipy",
    "matplotlib>=3.9.4",
    "pymatgen>=2024.8.9",
    "sumo",
    "ipywidgets"
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx-wagtail-theme", "myst-nb"]
tutorial = ["jupyterlab", "ipykernel", "nbformat", "ipympl"]
# db_plots.plot_db_combined_interactive and final_results.plot_final_result_interactive
# set fig.canvas.header_visible, which only the ipympl backend (%matplotlib
# widget) provides. Everything else in the package works without it, so this is
# an extra rather than a runtime dependency.
interactive = ["ipympl"]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[project.urls]
# No Documentation entry yet: docs/ builds with Sphinx but is not hosted
# anywhere (no .readthedocs.yaml, no gh-pages). Add one when it is published.
Homepage = "https://github.com/SMTG-Bham/solphin"
Repository = "https://github.com/SMTG-Bham/solphin"
Issues = "https://github.com/SMTG-Bham/solphin/issues"

[tool.setuptools.packages.find]
include = ["solphin*"]

# db_fom.load_spectrum and vasp_inputs.load_recipe resolve these through
# importlib.resources at runtime, so they must ship inside the wheel.
[tool.setuptools.package-data]
"solphin.resources" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rx prints the strict-xfail register on every run; tests/README.md explains
# what each entry means and why fixing the source is expected to turn it red.
addopts = "-rx"
xfail_strict = true
# Note: the default "prepend" import mode is load-bearing. test_dos.py and
# test_vasp_inputs.py do `from conftest import requires_potcars`, which only
# resolves because tests/ has no __init__.py and lands on sys.path.

[tool.coverage.run]
source = ["solphin"]

[tool.ruff]
target-version = "py311"
# 100 rather than ruff's default 88: 163 existing lines exceed 88 and only 76
# exceed 100, so this keeps the pending `ruff format` sweep (#34) proportionate.
line-length = 100
# docs/source/full_workflow_tutorial.ipynb is a git-tracked symlink to the file
# in tutorial/. Without this, ruff lints the notebook twice and reports every
# finding in it twice -- and a `--fix` reaching it through the docs/ path would
# write the result back atomically, replacing the symlink with a real copy.
extend-exclude = ["docs/source/full_workflow_tutorial.ipynb"]

[tool.ruff.lint]
# Import hygiene only for now; widen once the outstanding F841/UP032 findings
# in db_plots.py and final_results.py are dealt with.
select = ["E402", "F401", "F811", "I"]

[tool.ruff.lint.isort]
known-first-party = ["solphin"]
