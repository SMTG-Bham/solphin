[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solphin"
version = "1.0.0"
description = "Figure of Merit for Photovoltaics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Philippa U Cox", email = "puc369@student.bham.ac.uk" },
    { name = "Peter P Russell", email = "ppr466@student.bham.ac.uk" }
]
keywords = [
    "photovoltaics",
    "solar",
    "VASP",
    "CASTEP",
    "OptaDOS",
    "DFT",
    "detailed-balance",
    "SLME"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

dependencies = [
    "numpy>=2.0",
    "scipy",
    "matplotlib>=3.9.4",
    "pymatgen>=2024.8.9",
    # First release whose own numpy usage and metadata (numpy>=2.0,
    # castepxbin>=0.3.1) match the numpy>=2.0 floor above.
    "sumo>=3.0",
    "castepxbin",
    "ipywidgets"
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx-wagtail-theme", "myst-nb"]
tutorial = ["jupyterlab", "ipykernel", "nbformat", "ipympl"]
interactive = ["ipympl"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit", "build", "twine"]

[project.urls]
Homepage = "https://github.com/SMTG-Bham/solphin"
Documentation = "https://solphin.readthedocs.io"
Repository = "https://github.com/SMTG-Bham/solphin"
Issues = "https://github.com/SMTG-Bham/solphin/issues"

[tool.setuptools.packages.find]
include = ["solphin*"]
[tool.setuptools.package-data]
"solphin" = ["py.typed"]
"solphin.resources" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rx"
xfail_strict = true
# A deprecation inside sumo itself, on a code path solphin only reaches through
# sumo's public API, so there is nothing in solphin/ to change. sumo 3.0.0
# (September 2026) still carries it, so there is no version to upgrade to
# either.
#
# Matched on message rather than module: pytest hands each entry to
# warnings._setoption, which re.escape()s the module field and anchors it with
# \Z, so a module pattern can only ever equal one machine's absolute
# site-packages path. `sumo.symmetry.*` looks right and matches nothing.
filterwarnings = [
    # spglib 2.5 deprecated the mapping interface on its dataset; sumo still
    # subscripts it in the spg_symbol and spg_number properties of
    # sumo.symmetry.kpath and in get_path_data's logging in
    # sumo.symmetry.kpoints. solphin never imports spglib -- every one of those
    # reads sits behind get_path_data, via generate_band_structure_path.
    "ignore:dict interface is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["solphin"]
relative_files = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "docs/source/full_workflow_tutorial.ipynb",
    "docs/source/castep_workflow_tutorial.ipynb",
]
# Import roots, so isort can tell first-party from third-party. pytest puts
# tests/ on sys.path via rootdir insertion, which is how the suite imports
# conftest and castep_fixtures -- but ruff does not read pytest's config, so
# without tests/ listed here it files both under third-party and asks for
# `import castep_fixtures` to sit between numpy and pytest. Naming the roots
# fixes the classification itself, rather than enumerating the two module
# names, so a new helper added to tests/ is sorted correctly on arrival.
src = [".", "tests"]

[tool.ruff.lint]
select = ["E402", "F401", "F811", "I", "D", "D212", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test docstrings are declarative statements of the property under test.
"tests/*" = ["D401"]

[tool.ruff.lint.isort]
known-first-party = ["solphin"]
[tool.mypy]
python_version = "3.11"
files = ["solphin", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sumo.*", "ipywidgets.*", "ipympl.*", "scipy.*"]
ignore_missing_imports = true
