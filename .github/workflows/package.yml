name: package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Building and checking is under a minute; the rest is pip pulling numpy,
    # scipy, matplotlib, pymatgen and sumo into the smoke-test venv.
    timeout-minutes: 20
    steps:
      # Default depth-1. Nothing reads history, and the expected-file list below
      # comes from the index via `git ls-files`, which a shallow clone carries in
      # full.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # One version, not test.yml's matrix. The wheel is py3-none-any and
          # test.yml already installs the package on supported Pythons 3.11
          # through 3.14; future-python.yml also probes the 3.15 preview. What
          # this job adds -- whether the declared data files reach the artefacts
          # -- does not vary with the interpreter. 3.12 keeps it in step with
          # the lint job.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pinned for the same reason ruff and mypy are in test.yml: these two tools
      # *are* the check, so a new release must not change the verdict on its own.
      # twine cannot go below 6.1 whatever else changes -- setuptools>=77 emits
      # Metadata-Version 2.4 for the PEP 639 license fields in pyproject.toml,
      # and twine 6.0 rejects that as invalid metadata.
      - run: pip install build==1.5.0 twine==7.0.0

      # No --sdist --wheel. Bare `python -m build` builds the sdist and then
      # builds the wheel *from that sdist*, so anything MANIFEST.in prunes that
      # the wheel actually needs -- LICENSE for license-files, README.md for
      # readme -- fails here instead of quietly working because the source tree
      # happened to still be there.
      - run: python -m build

      # --strict, so a warning is a failure. README.md is the PyPI
      # long_description; a rendering problem that only warns is exactly the
      # drift this workflow exists to catch.
      - run: twine check --strict dist/*

      # Uploaded before the assertions rather than after, so that when one fails
      # the artefact that failed it can be downloaded and opened. ~40 kB.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # MANIFEST.in and [tool.setuptools.package-data] are two hand-maintained
      # lists of the same facts, and nothing else notices when they disagree:
      # db_fom.load_spectrum and vasp_inputs resolve these files through
      # importlib.resources at runtime, so a wheel missing one installs and
      # imports perfectly and fails on first use.
      - name: Assert the data files reached both artefacts
        run: |
          set -euo pipefail
          # An unmatched glob must abort, not survive as the literal string
          # "dist/*.whl" and make the greps below fail for the wrong reason.
          shopt -s failglob
          whl=(dist/*.whl)
          sdist=(dist/*.tar.gz)
          # The member listings are scratch. Keeping them out of the checkout
          # costs nothing here and means the same script can be pasted into a
          # working tree without leaving four untracked files behind.
          work=$(mktemp -d)
          [[ ${#whl[@]} -eq 1 ]] || { echo "::error::expected one wheel in dist/, found ${#whl[@]}"; exit 1; }
          [[ ${#sdist[@]} -eq 1 ]] || { echo "::error::expected one sdist in dist/, found ${#sdist[@]}"; exit 1; }

          # `python -m zipfile --list` prints a padded three-column table with a
          # header, so it cannot be matched exactly; unzip -Z1 prints bare member
          # paths and is in the runner image. Stripping trailing slashes from
          # directory entries and dropping the sdist's solphin-<version>/ prefix
          # puts both listings into the shape git reports, so one exact-match
          # test serves both and no version number is hard-coded.
          unzip -Z1 "${whl[0]}" | sed 's#/*$##' | sort -u > "$work/wheel-members.txt"
          tar --list --file "${sdist[0]}" | cut -d/ -f2- | sed 's#/*$##' | sort -u > "$work/sdist-members.txt"

          # Derived from the checkout rather than listed here, so a new spectrum
          # CSV cannot pass this check by being forgotten in a third place as
          # well as in the two lists it is meant to be guarding.
          git ls-files -- solphin/py.typed 'solphin/resources/*.csv' 'solphin/resources/*.json' > "$work/expected.txt"
          n=$(wc -l < "$work/expected.txt")
          # Ten today: py.typed, eight spectra and base_recipes.json. The floor is
          # here so a glob that stops matching fails loudly instead of passing
          # vacuously against an empty list.
          [[ "$n" -ge 10 ]] || { echo "::error::expected-file list has $n entries, want >= 10 -- the glob is wrong, not the artefacts"; exit 1; }
          echo "checking $n data files against both artefacts"

          # Collect every failure before exiting: which files are missing is the
          # whole diagnosis, and stopping at the first hides it.
          rc=0
          while read -r f; do
            grep -qxF -- "$f" "$work/wheel-members.txt" || { echo "::error::$f is missing from the wheel"; rc=1; }
            grep -qxF -- "$f" "$work/sdist-members.txt" || { echo "::error::$f is missing from the sdist"; rc=1; }
          done < "$work/expected.txt"

          # MANIFEST.in prunes these. tests/ alone is ~134 MB of reference
          # data against PyPI's 100 MB per-file limit, so this is not a
          # tidiness check. Comparing whole first path components rather than
          # a "^tests/" regex keeps the .github entry exact.
          cut -d/ -f1 "$work/sdist-members.txt" | sort -u > "$work/sdist-top.txt"
          for d in tutorial docs tests .github; do
            ! grep -qxF -- "$d" "$work/sdist-top.txt" || { echo "::error::$d/ is in the sdist; MANIFEST.in prunes it"; rc=1; }
          done

          # ~40 kB today. A loose ceiling, as a blunter second net under the
          # prune check above for anything large arriving somewhere those four
          # names do not cover.
          bytes=$(stat -c%s "${sdist[0]}")
          echo "sdist is $bytes bytes"
          [[ "$bytes" -lt 5242880 ]] || { echo "::error::sdist is $bytes bytes, over the 5 MB ceiling"; rc=1; }

          exit $rc

      # The listing above proves the bytes are in the zip. This proves
      # importlib.resources can reach them through the same call the package
      # makes, which is what actually breaks if solphin/resources/__init__.py
      # goes missing or package-data stops matching.
      - name: Install the wheel into a clean venv and load its data files
        run: |
          set -euo pipefail
          shopt -s failglob
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          # Run from outside the checkout: `python -` puts the cwd on sys.path,
          # so from the repo root this would import the solphin/ directory
          # sitting there and prove nothing about the wheel.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          from importlib.resources import files

          import solphin
          from solphin.db_fom import load_spectrum

          print("imported solphin", solphin.__version__, "from", solphin.__file__)
          assert (files("solphin") / "py.typed").is_file(), "py.typed did not survive the install"
          assert (files("solphin.resources") / "base_recipes.json").is_file(), "base_recipes.json missing"
          print("AM1.5 spectrum:", load_spectrum("AM1.5").shape)
          PY
