name: future-python

on:
  schedule:
    # Python 3.15 is still a release candidate. Probe it weekly without making
    # every pull request wait for dependencies that may need source builds.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Preview interpreter and dependency failures are an early-warning signal,
    # not a statement that a supported release is broken. Promote this version
    # into test.yml and remove this allowance once Python 3.15 is final and a
    # normal dependency resolve passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
