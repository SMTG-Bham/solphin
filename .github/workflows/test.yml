name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# tutorial/ checks out to 134 MB of VASP reference data that the test suite
# reads, but checkout@v4's default fetch-depth of 1 keeps the transfer to
# ~11 MB -- .git is large because of history, not HEAD. Superseded runs are
# still not worth paying for.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new ruff release cannot turn the branch red on its own.
      # Keep in step with the rev in .pre-commit-config.yaml.
      - run: pip install ruff==0.16.4
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    # The suite parses ~130 MB of vasprun.xml and compute_dos re-reads its
    # vasprun up to ten times; locally it is ~9 s, but bound it anyway.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python and the classifiers in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # -rx and xfail_strict come from [tool.pytest.ini_options].
      #
      # Two tests skip here by design: requires_potcars keys on
      # PMG_VASP_PSP_DIR, and VASP pseudopotentials are licensed and cannot be
      # put in CI. Ten more are strict xfails standing in for known defects --
      # see tests/README.md. Either turning into a failure is a real signal.
      - run: pytest
